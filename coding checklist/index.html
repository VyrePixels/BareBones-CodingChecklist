<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Checklist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="titlecontainer">
        <h1 id="cctitle">Coding Checklist</h1>
        <button id="cac">Create a checklist</button>
        <hr>
    </div>
    <div id="cacbox">
        <p style="font-family: sans-serif; font-size: 1.5em; text-align: center;">create a checklist</p>
        <button style="background-color: red; position: relative; top: -7vh; left: 57vw;" id="closecac">X</button><hr>
        <label for="cacname">Name: </label><input type="text" name="" id="cacname" style="color: black;"><br><br>
        <label for="">Language / Project: </label><input type="text" name="" id="" style="color: black;">
    </div>
    <div class="dropdown">
        <button id="choosel">Choose a coding language</button>
        <div id="menu">
            <ul>
                <div id="columns">
                    <div id="column1">
                        <li><a href="">Web Development</a></li>
                    </div>
                    <div id="column2">
                        <li>python code</li>
                    </div>
                    <div id="column3">
                        <li>c++ code</li>
                    </div>
                </div>
            </ul>
        </div>
    </div>
    <div id="checklist" class="checboxes">
        <input type="checkbox" name="" id="labeleddivs"><label for="labeleddivs">labeled divs</label>
    </div>
    <script src="index.js"></script>
</body>
</html>
